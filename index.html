<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chaque jour avec toi ❤️</title>

<style>
body {
    margin:0;
    min-height:100vh;
    font-family: Georgia, serif;
    background: linear-gradient(135deg,#ffb6c1,#ff9966,#ffd86f);
    display:flex;
    justify-content:center;
    align-items:center;
    color:#5a2630;
}

.carnet {
    background:white;
    width:90%;
    max-width:420px;
    border-radius:25px;
    padding:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

h1 {
    font-size:34px;
}

.coeur {
    font-size:50px;
}

button {
    background:#ff6f91;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:30px;
    font-size:18px;
}

.photo {
    width:100%;
    height:250px;
    background:#f5d6d9;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:20px 0;
}

.cache {
    display:none;
}

.jour {
    margin-top:20px;
    padding:15px;
    border-radius:15px;
    background:#fff3f0;
}

.lock {
    opacity:0.5;
}
</style>

</head>

<body>

<div class="carnet">

<div class="coeur">❤️</div>

<h1>Chaque jour avec toi</h1>

<p>
Même loin de toi, je voulais te laisser
un petit souvenir chaque jour jusqu'à mon retour.
</p>

<div id="contenu"></div>

</div>

<script>
    const surprises = [
  {
    date: "2026-07-30",
    titre: "Petit bonheur n°1 ❤️",
    photo: "photos/photo1.jpg",
    texte: "Écris ici ton premier petit mot pour elle."
  },
  {
    date: "2026-07-31",
    titre: "Petit bonheur n°2 ❤️",
    photo: "photos/photo2.jpg",
    texte: "Ton deuxième message."
  },
  {
    date: "2026-08-01",
    titre: "Petit bonheur n°3 ❤️",
    photo: "photos/photo3.jpg",
    texte: "Ton troisième message."
  },

  // Les autres jours seront ajoutés ici
];


const aujourdHui = new Date();
const contenu = document.getElementById("contenu");

surprises.forEach((souvenir, index) => {

    const dateOuverture = new Date(souvenir.date);

    const bloc = document.createElement("div");
    bloc.className = "jour";

    if (aujourdHui >= dateOuverture) {

        bloc.innerHTML = `
        <h2>${souvenir.titre}</h2>

        <div class="photo">
            📸 ${souvenir.photo}
        </div>

        <p>${souvenir.texte}</p>
        `;

    } else {

        bloc.className += " lock";

        bloc.innerHTML = `
        <h2>🔒 Petit bonheur n°${index + 1}</h2>
        <p>Disponible bientôt ❤️</p>
        `;

    }

    contenu.appendChild(bloc);

});

</script>

</body>
</html>
