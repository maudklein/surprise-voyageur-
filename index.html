<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaque jour avec toi ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Georgia", serif;
    background: linear-gradient(160deg, #ffb6c1, #ff9966, #ffd86f);
    color: #5a2630;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 420px;
    background: rgba(255,255,255,0.9);
    border-radius: 25px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

h1 {
    font-size: 34px;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 18px;
    line-height: 1.5;
    margin-bottom: 30px;
}

.heart {
    font-size: 45px;
    animation: pulse 2s infinite;
}

button {
    border: none;
    background: linear-gradient(90deg,#ff6f91,#ff9671);
    color: white;
    padding: 15px 30px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
}

@keyframes pulse {
    0% {transform: scale(1);}
    50% {transform: scale(1.15);}
    100% {transform: scale(1);}
}

</style>

</head>

<body>

<div class="container">

<div class="heart">❤️</div>

<h1>Chaque jour avec toi</h1>

<p class="subtitle">
Même si quelques kilomètres nous séparent,
je voulais te laisser un petit morceau de nous
chaque jour jusqu'à nos retrouvailles.
</p>

<button>
Ouvrir mon carnet 💌
</button>

</div>

</body>
</html>
